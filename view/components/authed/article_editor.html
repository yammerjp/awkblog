<div class="bg-white rounded-lg shadow-sm border border-gray-200 p-3 sm:p-6">
  <div class="mb-6">
    <label for="title-input" class="block text-sm font-medium text-gray-700 mb-2"><%= t["post_title"] %></label>
    <input type="text" name="title" id="title-input" placeholder="Enter your post title..." value="<%= v["title"] %>" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
  </div>

  <div class="mb-6">
    <label for="og-image-input" class="block text-sm font-medium text-gray-700 mb-2"><%= t["og_image"] %></label>
    <input type="text" name="og_image" id="og-image-input" placeholder="https://example.com/image.png" value="<%= v["og_image"] %>" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
    <div id="og-image-preview" class="mt-2 hidden">
      <img id="og-image-preview-img" src="" alt="OG Image Preview" class="max-w-xs max-h-32 rounded border border-gray-200">
    </div>
  </div>

  <div class="mb-6">
    <div class="flex justify-between items-center mb-2">
      <label for="textarea-of-article" class="block text-sm font-medium text-gray-700"><%= t["post_content"] %></label>
      <button type="button" id="button-to-add-image" class="inline-flex items-center px-3 py-1.5 text-sm text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <%= t["upload_image"] %>
      </button>
    </div>
    <div class="content-container relative">
      <div id="content-dummy" class="invisible overflow-hidden whitespace-pre-wrap break-words p-4 min-h-[300px] border border-gray-300"></div>
      <textarea name="content" id="textarea-of-article" placeholder="Write your post content in Markdown..." class="absolute top-0 left-0 w-full h-full p-4 border border-gray-300 rounded-lg resize-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all bg-white font-mono text-sm"><%= v["content"] %></textarea>
    </div>
  </div>

  <input type="file" id="input-image" accept="image/jpeg,image/png,image/gif,image/webp" class="hidden">
  <input type="hidden" name="zpadding" value="<%= http::defaultLeftOverPadding() %>">

  <div class="flex justify-end gap-3">
    <a href="/authed/posts" class="px-6 py-2.5 text-gray-700 bg-gray-100 hover:bg-gray-200 font-medium rounded-lg transition-colors no-underline inline-flex items-center">
      <%= t["cancel"] %>
    </a>
    <button type="submit" class="px-6 py-2.5 bg-primary-500 hover:bg-primary-600 text-white font-medium rounded-lg transition-colors inline-flex items-center">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
      <%= t["publish"] %>
    </button>
  </div>
</div>

<style>
  #textarea-of-article.dragover {
    border: dashed 3px #93c5fd !important;
    background-color: #eff6ff !important;
  }
</style>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.0/dist/browser-image-compression.js"></script>
<script type="text/javascript" src="/assets/uploadImage.js"></script>
<script>
  const buttonToAddImage = document.getElementById("button-to-add-image")
  const inputImage = document.getElementById("input-image")
  const textareaOfArticle = document.getElementById("textarea-of-article")
  const contentDummy = document.getElementById("content-dummy")
  const ogImageInput = document.getElementById("og-image-input")
  const ogImagePreview = document.getElementById("og-image-preview")
  const ogImagePreviewImg = document.getElementById("og-image-preview-img")

  // OG image validation and preview
  const s3AssetHost = "<%= v["s3_asset_host"] %>"
  const isValidOgImageUrl = (url) => {
    if (url === "") return true
    if (!s3AssetHost) return false
    return url.startsWith(s3AssetHost)
  }
  const updateOgImagePreview = () => {
    const url = ogImageInput.value.trim()
    if (url && isValidOgImageUrl(url)) {
      ogImagePreviewImg.src = url
      ogImagePreview.classList.remove("hidden")
      ogImageInput.classList.remove("border-red-500")
    } else if (url && !isValidOgImageUrl(url)) {
      ogImagePreview.classList.add("hidden")
      ogImageInput.classList.add("border-red-500")
    } else {
      ogImagePreview.classList.add("hidden")
      ogImageInput.classList.remove("border-red-500")
    }
  }
  ogImageInput.addEventListener("input", updateOgImagePreview)
  ogImagePreviewImg.addEventListener("error", () => {
    ogImagePreview.classList.add("hidden")
  })
  updateOgImagePreview()

  // Form validation
  ogImageInput.closest("form").addEventListener("submit", (e) => {
    const url = ogImageInput.value.trim()
    if (!isValidOgImageUrl(url)) {
      e.preventDefault()
      alert("OG画像URLはこのサービスでアップロードした画像のURLを指定してください")
      ogImageInput.focus()
    }
  })

  // expand height of textarea
  textareaOfArticle.addEventListener('input', e => {
      contentDummy.textContent = e.target.value + '\u200b'
  })

  // upload image on click
  buttonToAddImage.addEventListener("click", () => {
    inputImage.click()
  })
  inputImage.addEventListener("change", (event) => {
    event.preventDefault()
    upload(event.target.files[0])
  })

  // modify style on drag over
  const startDragOver = (event) => {
    event.preventDefault()
    event.target.classList.add('dragover')
  }
  const endDragOver = (event) => {
    event.preventDefault()
    event.target.classList.remove('dragover')
  }
  textareaOfArticle.addEventListener('dragenter', startDragOver)
  textareaOfArticle.addEventListener('dragover', startDragOver)
  textareaOfArticle.addEventListener('dragleave', endDragOver)
  textareaOfArticle.addEventListener('dragend', endDragOver)
  textareaOfArticle.addEventListener('drop', function(event) {
    endDragOver(event)

    // upload file on drop
    const files = event?.dataTransfer?.files;
    if (files === undefined) {
      alert("only support to drop files")
      return
    }
    upload(files[0])
  })

  const upload = (file) => {
    const acceptedImageTypes = inputImage.getAttribute('accept').split(',')
    if (!acceptedImageTypes.some(type => file.type.match(type))) {
      alert(`only support ${acceptedImageTypes.join(',')}`)
      return
    }

    uploadImage(
      file,
      () => {}
      // function (message) { console.log("uploadImage(): " + message) }
    ).then(imageUrl => {
      textareaOfArticle.setRangeText(
        `![image](${imageUrl})`,
        textareaOfArticle.selectionStart,
        textareaOfArticle.selectionEnd,
        'end'
      )
    }).catch(e => {
      // console.error(`catched ${e}`)
      alert('failed to upload a image')
    })
  }
</script>
