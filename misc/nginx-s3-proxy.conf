# Web delivery (port 80 -> garage:3902)
server {
    listen 80;

    location / {
        proxy_pass http://garage:3902;
        proxy_set_header Host awkblog-images.web.garage;
        proxy_hide_header x-amz-meta-*;
    }
}

# S3 API for presigned POST (port 8080 -> garage:3900)
server {
    listen 8080;

    location / {
        proxy_pass http://garage:3900;
        proxy_set_header Host awkblog-images.s3.garage;
        proxy_hide_header x-amz-meta-*;

        # Allow POST from browser
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, OPTIONS';
            add_header 'Access-Control-Allow-Headers' '*';
            return 204;
        }
    }
}
