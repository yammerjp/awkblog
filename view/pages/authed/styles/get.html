<!DOCTYPE html>
<html lang="ja">
  <head>
    <%#include components/authed/console_head.html %>
  </head>
  <body class="bg-gray-50">
    <%#include components/authed/header.html %>
    <main class="max-w-5xl mx-auto px-3 sm:px-6 py-8">
      <div class="mb-6">
        <h1 class="text-3xl font-bold text-gray-900 mb-2"><%= t["style_settings"] %></h1>
        <p class="text-gray-600">
          <%= t["style_settings_description"] %>
        </p>
      </div>

      <form action="/authed/styles" method="post" class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 sm:p-6">
        <div class="mb-6">
          <label for="style-textarea" class="block text-sm font-medium text-gray-700 mb-2">
            <%= t["custom_css"] %>
          </label>
          <textarea
            id="style-textarea"
            name="style"
            rows="20"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all font-mono text-sm resize-y"
            placeholder="/* Enter your custom CSS here... */"
          ><%= v["style"] %></textarea>
          <p class="mt-2 text-sm text-gray-500">
            <%= t["custom_css_help"] %>
          </p>
        </div>

        <div class="flex justify-end gap-3">
          <a href="/authed" class="px-6 py-2.5 text-gray-700 bg-gray-100 hover:bg-gray-200 font-medium rounded-lg transition-colors no-underline">
            <%= t["cancel"] %>
          </a>
          <button type="submit" class="px-6 py-2.5 bg-primary-500 hover:bg-primary-600 text-white font-medium rounded-lg transition-colors inline-flex items-center">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <%= t["submit"] %>
          </button>
        </div>
      </form>
    </main>
    <footer class="border-t border-gray-200 mt-16 py-8">
      <div class="max-w-5xl mx-auto px-3 sm:px-6 text-center text-gray-500 text-sm">
        <a href="https://github.com/yammerjp/awkblog" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-gray-600 hover:text-gray-900 transition-colors no-underline">
          <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24">
            <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" />
          </svg>
          <%= t["view_on_github"] %>
        </a>
      </div>
    </footer>
  </body>
</html>
